# pytest configuration — makes `pytest` work from the repository root without
# requiring PYTHONPATH to be exported by every caller (CI, shells, editors).
# The `backend`, `scripts`, and `telegram_bot` packages are imported by path
# from the project root, so the root directory must be on sys.path.
[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
# Strict markers keep the CI selection below honest: a typo in
# `requires_served_model` would otherwise silently deselect the model-identity
# tests and read as a green run.
addopts = --strict-markers
markers =
    requires_served_model: asserts facts about the real trained artifact (algorithm, feature count, published MAPE, fitted vocabulary). Needs MODEL_DIR or a pinned MODEL_URL + MODEL_SHA256; the CI job model-artifact-certification runs them and fails loudly when no artifact source is configured.
    integration_db: touches a real PostgreSQL (reads/writes live rows or applies DDL). Selection: these skip (clearly reported) when no disposable test database is explicitly authorized by config. Safety: enforced independently at the PRE-connect layer by tests/db_safety (SQLAlchemy do_connect), which refuses any PostgreSQL connection to a target that is not the exact named disposable test database (KM_TEST_DB_APPROVED + APP_ENV=test + KM_TEST_DB_NAME + loopback/KM_TEST_DB_HOSTS host) — even from an unmarked test, and before any socket is opened — so no test can modify a real store.
